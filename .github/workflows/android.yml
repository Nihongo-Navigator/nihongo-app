name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK (Silent Mode)
        run: |
          # This command creates the project folder without asking questions
          bubblewrap init --manifest="https://nihongo-navigator.in/manifest.json" --yes
          
          # This builds the actual APK file
          # We use --skipSigning because we are just testing for now
          bubblewrap build --skipSigning --yes
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nihongo-Navigator-APK
          path: ./*.apk
