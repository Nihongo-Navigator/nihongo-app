name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK (Express Mode)
        run: |
          # 1. Initialize with the local manifest and force default answers
          bubblewrap init --manifest=manifest.json --yes
          
          # 2. Build the APK while skipping every possible interactive prompt
          bubblewrap build --skipSigning --yes
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nihongo-Navigator-APK
          path: ./*.apk
