name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install and Build (Hard Force)
        run: |
          # 1. Install the tool
          npm install -g @bubblewrap/cli
          
          # 2. Pre-create the config folder and file so it NEVER asks for paths
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          
          # 3. Accept all licenses in the background
          yes | sdkmanager --licenses || true
          
          # 4. Run the Init and Build using 'yes' to spam the Enter key
          # We use --skipSigning to avoid the "Create a password" prompt
          yes | bubblewrap init --manifest=manifest.json --yes
          yes | bubblewrap build --skipSigning --yes
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nihongo-Navigator-APK
          path: ./*.apk
